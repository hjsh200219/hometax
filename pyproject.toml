[project]
name = "hometax"
version = "0.5.0"
description = "HomeTax electronic tax invoice CLI and library, driven by a file-based NPKI certificate"
requires-python = ">=3.12"
dependencies = [
  "asn1crypto>=1.5.1,<2",
  "cryptography>=45,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "uvicorn>=0.34,<1",
  "xmlsec>=1.3,<2",
]

[project.scripts]
hometax = "hometax_login.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hometax_login"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
